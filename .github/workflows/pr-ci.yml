# PR CI — exact-head verification of glass_wind_calc_M on a GitHub-hosted runner.
#
# Runs the repository's own checks against the PR head commit itself (not the
# temporary merge ref): npm test, publication lint, project-state probe,
# verifier package, and all 16 browser harnesses. The Pack Review print harness
# (S3-B3B2-C2) prints a real PDF through the page's own button and native
# window.print() in headed Chromium on a virtual display (Xvfb, --kiosk-printing,
# Save as PDF) and reads it with Poppler; if Xvfb, headed Chromium, Poppler or
# XTest is missing the job fails as CI infrastructure BLOCKED, never as a pass.
#
# - Ready PRs only. Draft PRs are skipped. A new push to the same PR cancels the
#   older run.
# - Read-only token, no secrets, no deploy, no artifact upload.
# - A harness is PASS only when it exits 0. Exit 1 FAIL, 3 UNVERIFIED and 4 ERROR
#   all fail the job; nothing is converted to success.
# - Adding this workflow does not make it a required check. Branch protection
#   and required checks are configured separately.
name: pr-ci

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: exact-head verification
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - name: Check out the PR head commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind to the exact head and fetch origin/main
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          echo "PR head (event): ${PR_HEAD_SHA}"
          echo "checked out:     ${actual_head}"
          if [ "${actual_head}" != "${PR_HEAD_SHA}" ]; then
            echo "::error::checked-out HEAD ${actual_head} is not the PR head ${PR_HEAD_SHA}"
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          main_sha="$(git rev-parse --verify 'origin/main^{commit}')"
          merge_base="$(git merge-base origin/main HEAD)"
          head_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "PR base (event): ${PR_BASE_SHA}"
          echo "origin/main:     ${main_sha}"
          echo "merge-base:      ${merge_base}"
          echo "head tree:       ${head_tree}"
          if [ "${main_sha}" != "${PR_BASE_SHA}" ]; then
            echo "::warning::origin/main ${main_sha} differs from the PR base ${PR_BASE_SHA} recorded by the event"
          fi
          {
            echo "### Exact-head binding"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| PR head (event) | \`${PR_HEAD_SHA}\` |"
            echo "| checked out HEAD | \`${actual_head}\` |"
            echo "| head tree | \`${head_tree}\` |"
            echo "| PR base (event) | \`${PR_BASE_SHA}\` |"
            echo "| origin/main | \`${main_sha}\` |"
            echo "| merge-base | \`${merge_base}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: npm test
        run: |
          set -euo pipefail
          node --version
          npm test 2>&1 | tee "${RUNNER_TEMP}/npm-test.txt"
          # Exit code 0 is necessary but not sufficient: the TAP summary must
          # exist and report at least one pass and zero failures.
          grep -Eq '^# pass [1-9][0-9]*$' "${RUNNER_TEMP}/npm-test.txt"
          grep -Eq '^# fail 0$' "${RUNNER_TEMP}/npm-test.txt"
          grep -E '^# (tests|pass|fail|cancelled|skipped|todo) ' "${RUNNER_TEMP}/npm-test.txt" >> "${GITHUB_STEP_SUMMARY}"

      - name: Publication lint
        run: npm run -s lint:evidence-publication

      - name: Project state probe
        run: node tools/verification/project-state-probe.mjs

      - name: Verifier package
        run: node tools/verification/verifier-package.mjs

      - name: Install Playwright and Chromium (pinned)
        run: |
          set -euo pipefail
          npm install --global --no-fund --no-audit "playwright@${PLAYWRIGHT_VERSION}"
          playwright --version
          playwright install --with-deps chromium
          # The harnesses resolve Playwright through resolve-playwright.mjs;
          # this fails the step if no candidate resolves.
          node --input-type=module -e "const m = await import('./tools/browser-checks/resolve-playwright.mjs'); const r = await m.resolvePlaywright(); console.log('playwright resolved via ' + r.source);"

      - name: Install Poppler and Xvfb for the native PDF route (S3-B3B2-C2)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils xvfb xauth libxtst6 libx11-6
          blocked=0
          for tool in pdfinfo pdftotext pdftoppm xvfb-run python3; do
            if ! command -v "${tool}" > /dev/null; then
              echo "::error::CI infrastructure BLOCKED: ${tool} is not available"
              blocked=1
            fi
          done
          if ! python3 -c 'import ctypes; ctypes.CDLL("libXtst.so.6"); ctypes.CDLL("libX11.so.6")'; then
            echo "::error::CI infrastructure BLOCKED: XTest (libXtst.so.6) is not loadable"
            blocked=1
          fi
          if [ "${blocked}" -ne 0 ]; then
            exit 1
          fi
          pdfinfo -v 2>&1 | head -n 1
          {
            echo "### Native PDF route"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| Poppler | \`$(pdfinfo -v 2>&1 | head -n 1)\` |"
            echo "| Xvfb | \`$(dpkg-query -W -f='${Version}' xvfb)\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Browser harnesses (16)
        run: |
          set -euo pipefail
          harnesses=(
            browser-w4
            failopen-w4
            parser-boundary
            probe-w4
            stageA-regression
            context-runtime
            project-pack-intake
            project-pack-execution
            project-pack-batch
            project-pack-report
            result-freshness
            three-view-navigation
            single-ux
            project-pack-review
            project-pack-review-export
            project-pack-review-print
          )
          if [ "${#harnesses[@]}" -ne 16 ]; then
            echo "::error::expected 16 harnesses, listed ${#harnesses[@]}"
            exit 1
          fi
          {
            echo "### Browser harnesses"
            echo ""
            echo "| harness | exit | state | outcome | checks | failures |"
            echo "|---|---|---|---|---|---|"
          } >> "${GITHUB_STEP_SUMMARY}"
          not_pass=0
          for h in "${harnesses[@]}"; do
            log="${RUNNER_TEMP}/browser-${h}.log"
            echo "::group::${h}"
            runner=(node)
            if [ "${h}" = "project-pack-review-print" ]; then
              # headed Chromium needs a display: the virtual one (no physical display, no printer)
              runner=(xvfb-run -a -s '-screen 0 1280x1024x24' node)
            fi
            if "${runner[@]}" "tools/browser-checks/${h}.mjs" > "${log}" 2>&1; then rc=0; else rc=$?; fi
            cat "${log}"
            echo "::endgroup::"
            case "${rc}" in
              0) state=PASS ;;
              1) state=FAIL ;;
              3) state=UNVERIFIED ;;
              4) state=ERROR ;;
              *) state="UNKNOWN(${rc})" ;;
            esac
            # The harness prints its outcome as the last JSON object in its output.
            if ! report="$(node -e '
              const t = require("fs").readFileSync(process.argv[1], "utf8");
              const i = t.lastIndexOf("{\n  \"schemaVersion\"");
              if (i < 0) { console.log("none - -"); process.exit(0); }
              const d = JSON.parse(t.slice(i));
              console.log([d.outcome, d.checksRun, d.failures].join(" "));
            ' "${log}")"; then
              report="unreadable - -"
            fi
            read -r outcome checks failures <<< "${report}"
            ok=1
            [ "${rc}" -eq 0 ] || ok=0
            [ "${outcome}" = "PASS" ] || ok=0
            [ "${failures}" = "0" ] || ok=0
            if [ "${h}" = "parser-boundary" ]; then
              # A bypass (guard accepts, Chromium builds an element) must be 0.
              # Over-rejections are fail-closed and reported separately.
              grep -Eq '^BYPASSES \(accept but Chromium makes an element\): 0 ' "${log}" || ok=0
              sed -n -e '/^BYPASSES/p' -e '/^over-rejections/p' "${log}"
            fi
            if [ "${h}" = "project-pack-review-print" ]; then
              # The authorised Pack PDF must come from the native route (button -> window.print() -> headed
              # Chromium -> Save as PDF -> Poppler). A run that did not print natively is not a pass.
              grep -Eq '^environment: .*native headed [0-9.]+ .*Poppler [0-9.]+' "${log}" || ok=0
              for id in PR-K01-native-button-print-d2-trace PR-K02-native-pdf-bound-to-request PR-K03-native-pdf-2000-rows-in-order \
                        PR-K05-native-pdf-trust-and-page-number-every-page PR-N01-direct-page-pdf-cannot-print-pack; do
                grep -Eq "^  ok   ${id} " "${log}" || ok=0
              done
              sed -n -e '/^environment:/p' "${log}"
              if [ "${rc}" -eq 3 ]; then
                echo "::error::CI infrastructure BLOCKED: the native PDF route was not available (${h} exit 3, UNVERIFIED)"
              fi
            fi
            if [ "${ok}" -ne 1 ]; then
              not_pass=$((not_pass + 1))
              echo "::error::${h}: exit ${rc} (${state}), outcome ${outcome}, failures ${failures}"
            fi
            echo "| ${h} | ${rc} | ${state} | ${outcome} | ${checks} | ${failures} |" >> "${GITHUB_STEP_SUMMARY}"
          done
          if [ "${not_pass}" -ne 0 ]; then
            echo "::error::${not_pass} of ${#harnesses[@]} browser harnesses did not PASS"
            exit 1
          fi
          echo "all ${#harnesses[@]} browser harnesses PASS"
